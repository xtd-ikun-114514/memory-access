plugins { id 'java' }

version '1.0'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly "com.github.Anuken.Mindustry:core:v160"
    compileOnly "com.github.Anuken.Arc:arc-core:v160"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Mindustry mod 源码约定在 src/ 下（而非默认的 src/main/java）
sourceSets.main {
    java.srcDirs = ['src/']
}

jar {
    archiveFileName = "${project.name}.jar"
    // 把 mod.json 打进 jar 根目录（Mindustry 加载 Java mod 必需）
    from(rootDir){
        include 'mod.json'
        include 'icon.png'
        include 'bundles/**'
    }
}
