memoryaccess.name = Memory Access
memoryaccess.description = Hover a memory cell to show Read/Write icons. Read copies the cell to the clipboard; Write pastes numbers back. A settings option caps the maximum copy size. Single-player only.\nSource: https://github.com/xtd-ikun-114514/memory-access
memoryaccess.settings = Memory Access
memoryaccess.copied = Copied memory block
memoryaccess.copy-fail = Copy failed: cell size {0} exceeds limit {1}
memoryaccess.wrote = Wrote {0} entries
memoryaccess.parse-fail = Parse failed
setting.memacc-maxlength.name = Max Copy Length
setting.memacc-maxlength.description = Maximum memory cell size (in slots) that can be copied. Larger cells will fail to copy.
